name: Build extension ZIP

on:
  push:
    branches:
      - '**'
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check manifest version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], encoding="utf-8").strip()

          version = json.loads(Path("manifest.json").read_text(encoding="utf-8"))["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,3}", version):
              raise SystemExit("manifest.json must contain a valid numeric extension version.")

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              before = event["before"]
              if before == "0" * 40:
                  # A newly created branch has no previous tip.
                  pushed = {commit["id"] for commit in event["commits"]}
                  history = git("rev-list", "--first-parent", "HEAD").splitlines()
                  before = next((commit for commit in history if commit not in pushed), None)
              elif subprocess.run(["git", "cat-file", "-e", f"{before}^{{commit}}"], stderr=subprocess.DEVNULL).returncode:
                  # A force push can leave the old tip outside the fetched branch history.
                  subprocess.run(["git", "fetch", "--no-tags", "origin", before], check=True)

              previous = None
              if before and git("ls-tree", "--name-only", before, "--", "manifest.json"):
                  previous = json.loads(git("show", f"{before}:manifest.json")).get("version")
              if version == previous:
                  print(f"Extension version remains {version}. Skipping build.")
                  raise SystemExit(0)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.version != ''
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run tests
        if: steps.version.outputs.version != ''
        run: npm test

      - name: Build extension ZIP
        if: steps.version.outputs.version != ''
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/selector-clicker-$BUILD_VERSION.zip"
          python3 scripts/package-chrome.py "$archive"
          python3 -m zipfile -t "$archive"

      - name: Save extension ZIP
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/selector-clicker-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false
