name: Chrome Web Store release

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: Submit this package for review and stage it for manual publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Build Chrome Web Store ZIP
        run: |
          python3 scripts/package-chrome.py "$RUNNER_TEMP/selector-clicker.zip"
          python3 -m zipfile -t "$RUNNER_TEMP/selector-clicker.zip"

      - name: Save release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/selector-clicker.zip
          if-no-files-found: error
          archive: false

      - name: Submit for review with manual publishing
        if: ${{ inputs.submit_for_review }}
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Select main when submitting to the Chrome Web Store."
            exit 1
          fi
          node scripts/submit-chrome.mjs "$RUNNER_TEMP/selector-clicker.zip"
