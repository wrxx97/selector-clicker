name: Build extension ZIP

on:
  push:
    branches:
      - '**'
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      notes: ${{ steps.notes.outputs.text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check manifest version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], encoding="utf-8").strip()

          version = json.loads(Path("manifest.json").read_text(encoding="utf-8"))["version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,3}", version):
              raise SystemExit("manifest.json must contain a valid numeric extension version.")

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              before = event["before"]
              if before == "0" * 40:
                  # A newly created branch has no previous tip.
                  pushed = {commit["id"] for commit in event["commits"]}
                  history = git("rev-list", "--first-parent", "HEAD").splitlines()
                  before = next((commit for commit in history if commit not in pushed), None)
              elif subprocess.run(["git", "cat-file", "-e", f"{before}^{{commit}}"], stderr=subprocess.DEVNULL).returncode:
                  # A force push can leave the old tip outside the fetched branch history.
                  subprocess.run(["git", "fetch", "--no-tags", "origin", before], check=True)

              previous = None
              if before and git("ls-tree", "--name-only", before, "--", "manifest.json"):
                  previous = json.loads(git("show", f"{before}:manifest.json")).get("version")
              if version == previous:
                  print(f"Extension version remains {version}. Skipping build.")
                  raise SystemExit(0)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.version != ''
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run tests
        if: steps.version.outputs.version != ''
        run: npm test

      - name: Build extension ZIP
        if: steps.version.outputs.version != ''
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/selector-clicker-$BUILD_VERSION.zip"
          python3 scripts/package-chrome.py "$archive"
          python3 -m zipfile -t "$archive"

      - name: Save extension ZIP
        id: archive
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/selector-clicker-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false
          overwrite: true

      - name: Read release notes
        id: notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.version != ''
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -f CHANGELOG.md ]]; then
            delimiter=$(python3 -c 'from uuid import uuid4; print(uuid4())')
            {
              printf 'text<<%s\n' "$delimiter"
              awk -v version="[$BUILD_VERSION]" '
                $1 == "##" { if (found) exit; found = ($2 == version); next }
                found { print }
              ' CHANGELOG.md
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: selector-clicker-release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Download tested ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          skip-decompress: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTES: ${{ needs.build.outputs.notes }}
        run: |
          tag="v$BUILD_VERSION"
          asset="selector-clicker-$BUILD_VERSION.zip"
          archive="$RUNNER_TEMP/release/$asset"
          test -s "$archive"

          tag_exists=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "any(.[]; .ref == \"refs/tags/$tag\")")
          if [[ "$tag_exists" == true ]]; then
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags%2F$tag" --jq '.sha')
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "$tag already points to another commit. Choose a new extension version."
              exit 1
            fi
          fi

          if ! release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets); then
            gh release create "$tag" "$archive" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Selector Clicker $tag" --notes "$RELEASE_NOTES" --generate-notes
            exit 0
          fi

          asset_uploaded() {
            jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' <<<"$release" >/dev/null
          }

          if [[ "$(jq -r '.isDraft' <<<"$release")" == true ]]; then
            if [[ "$(jq -r '.targetCommitish' <<<"$release")" != "$GITHUB_SHA" ]]; then
              echo "The draft for $tag targets another commit."
              exit 1
            fi
            if ! asset_uploaded; then
              gh release upload "$tag" "$archive" --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          elif [[ "$tag_exists" == true ]] && asset_uploaded; then
            echo "$tag is already published with $asset."
          else
            echo "The existing release for $tag is missing its tag or ZIP asset."
            exit 1
          fi
