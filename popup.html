<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Selector Clicker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>元素自动点击</h1>
          <p id="site-name">正在读取当前页面</p>
        </div>
        <label class="switch" title="启用或停用自动点击">
          <input id="enabled" type="checkbox" />
          <span class="slider"></span>
        </label>
      </header>

      <button id="pick-element" class="pick-element" type="button" disabled>在页面上选取元素</button>
      <p id="picker-status" class="picker-status" role="status"></p>
      <section id="site-rules" class="site-rules" hidden>
        <h2>当前网站的规则</h2>
        <ul id="site-rule-list"></ul>
      </section>

      <details id="advanced" class="advanced">
        <summary>全局选择器（高级）</summary>
        <label class="visually-hidden" for="selectors">全局 CSS 选择器</label>
        <textarea
          id="selectors"
          rows="5"
          spellcheck="false"
          placeholder=".ad-close&#10;[aria-label='Close ad']&#10;#popup .close"
        ></textarea>
        <p class="hint">每行一个 CSS 选择器，应用于所有网站。</p>
      </details>

      <label for="cooldown" class="cooldown-setting">
        同一元素冷却
        <span class="input-wrap"><input id="cooldown" type="number" min="1000" max="300000" step="1000" /> ms</span>
      </label>

      <p id="validation" class="validation" role="alert"></p>

      <div class="actions">
        <button id="scan-now" class="secondary" type="button" title="立即在当前页面扫描一次">立即扫描</button>
        <button id="save" class="secondary" type="button">保存设置</button>
      </div>

      <footer>
        <span id="status-dot" aria-hidden="true"></span>
        <span id="status">尚未启用</span>
        <span id="click-count"></span>
      </footer>
    </main>
    <script src="site-rules.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
